name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend — instalar, sintaxe, testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: backend/yarn.lock

      - name: Instalar dependências
        run: yarn install --frozen-lockfile

      - name: Verificação estática (sintaxe JavaScript)
        run: find src -name '*.js' -print0 | xargs -0 -I{} node --check {}

      - name: Testes (Vitest + MongoDB Memory Server)
        run: yarn test

  frontend:
    name: Frontend — instalar, lint, build, testes (unit + RTL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Instalar dependências
        run: yarn install --frozen-lockfile

      - name: ESLint
        run: yarn lint

      - name: TypeScript e build (análise estática)
        run: yarn build

      - name: Testes (Vitest)
        run: yarn test
